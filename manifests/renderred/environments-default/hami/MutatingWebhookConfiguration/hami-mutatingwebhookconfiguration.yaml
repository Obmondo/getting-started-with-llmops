apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: hami/hami-dra-webhook-serving-cert
  labels:
    app.kubernetes.io/managed-by: Helmraiser
    app.tanka.grafana.com: hami
  name: hami-mutatingwebhookconfiguration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: hami-dra-webhook
      namespace: hami
      path: /mutate
  failurePolicy: Fail
  name: mutate.hami.io
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
      - hami
  objectSelector:
    matchExpressions:
    - key: hami.io/skip-dra
      operator: NotIn
      values:
      - "true"
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
    scope: '*'
  sideEffects: NoneOnDryRun
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: hami-dra-webhook
      namespace: hami
      path: /mutate
  failurePolicy: Ignore
  name: mutate-update.hami.io
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
      - hami
  objectSelector:
    matchExpressions:
    - key: hami.io/dra
      operator: Exists
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - UPDATE
    resources:
    - pods
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: hami-dra-webhook
      namespace: hami
      path: /mutate-volcano
  failurePolicy: Fail
  name: mutate-volcano.hami.io
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
      - hami
  rules:
  - apiGroups:
    - batch.volcano.sh
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - jobs
    scope: '*'
  sideEffects: NoneOnDryRun
  timeoutSeconds: 10
