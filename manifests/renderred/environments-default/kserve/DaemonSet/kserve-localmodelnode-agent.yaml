apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: localmodel
    app.kubernetes.io/managed-by: Helmraiser
    app.kubernetes.io/name: kserve
    app.tanka.grafana.com: kserve
    control-plane: kserve-localmodelnode-agent
    controller-tools.k8s.io: "1.0"
  name: kserve-localmodelnode-agent
  namespace: kserve
spec:
  selector:
    matchLabels:
      control-plane: kserve-localmodelnode-agent
      controller-tools.k8s.io: "1.0"
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: kserve-localmodelnode-agent
        control-plane: kserve-localmodelnode-agent
        controller-tools.k8s.io: "1.0"
    spec:
      affinity: {}
      containers:
      - command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: kserve/kserve-localmodelnode-agent:v0.20.0
        imagePullPolicy: IfNotPresent
        name: manager
        resources:
          limits:
            cpu: 100m
            memory: 300Mi
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /mnt/models
          name: models
          readOnly: false
      nodeSelector:
        kserve/localmodel: worker
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kserve-localmodelnode-agent
      terminationGracePeriodSeconds: 10
      tolerations: []
      volumes:
      - hostPath:
          path: /models
          type: DirectoryOrCreate
        name: models
