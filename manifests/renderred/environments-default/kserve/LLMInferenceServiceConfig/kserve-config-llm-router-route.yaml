apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  labels:
    app.kubernetes.io/managed-by: Helmraiser
    app.tanka.grafana.com: kserve
  name: kserve-config-llm-router-route
  namespace: kserve
spec:
  router:
    route:
      http:
        spec:
          parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: '{{ .GlobalConfig.IngressGatewayName }}'
            namespace: '{{ .GlobalConfig.IngressGatewayNamespace }}'
          rules:
          - backendRefs:
            - group: inference.networking.k8s.io
              kind: InferencePool
              name: '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/completions
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}/v1/completions
            name: v1-completions-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.k8s.io
              kind: InferencePool
              name: '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/chat/completions
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}/v1/chat/completions
            name: v1-chat-completions-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.k8s.io
              kind: InferencePool
              name: '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/responses
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}/v1/responses
            name: v1-responses-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.k8s.io
              kind: InferencePool
              name: '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/messages
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}/v1/messages
            name: v1-messages-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.k8s.io
              kind: InferencePool
              name: '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
              port: 8000
              weight: 1
            matches:
            - headers:
              - name: '{{ .GlobalConfig.ModelBasedRoutingHeaderName }}'
                type: Exact
                value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}
              path:
                type: Exact
                value: /v1/completions
            - headers:
              - name: '{{ .GlobalConfig.ModelBasedRoutingHeaderName }}'
                type: Exact
                value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}
              path:
                type: Exact
                value: /v1/completions/
            - headers:
              - name: '{{ .GlobalConfig.ModelBasedRoutingHeaderName }}'
                type: Exact
                value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}
              path:
                type: Exact
                value: /v1/chat/completions
            - headers:
              - name: '{{ .GlobalConfig.ModelBasedRoutingHeaderName }}'
                type: Exact
                value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}
              path:
                type: Exact
                value: /v1/chat/completions/
            - headers:
              - name: '{{ .GlobalConfig.ModelBasedRoutingHeaderName }}'
                type: Exact
                value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}
              path:
                type: Exact
                value: /v1/responses
            - headers:
              - name: '{{ .GlobalConfig.ModelBasedRoutingHeaderName }}'
                type: Exact
                value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}
              path:
                type: Exact
                value: /v1/responses/
            - headers:
              - name: '{{ .GlobalConfig.ModelBasedRoutingHeaderName }}'
                type: Exact
                value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}
              path:
                type: Exact
                value: /v1/messages
            - headers:
              - name: '{{ .GlobalConfig.ModelBasedRoutingHeaderName }}'
                type: Exact
                value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}
              path:
                type: Exact
                value: /v1/messages/
            name: v1-model-routing
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.k8s.io
              kind: InferencePool
              name: '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/completions
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}/v1/completions
            name: v1-completions-publisher-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.k8s.io
              kind: InferencePool
              name: '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/chat/completions
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}/v1/chat/completions
            name: v1-chat-completions-publisher-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.k8s.io
              kind: InferencePool
              name: '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/responses
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}/v1/responses
            name: v1-responses-publisher-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.k8s.io
              kind: InferencePool
              name: '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/messages
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}/v1/messages
            name: v1-messages-publisher-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - kind: Service
              name: '{{ ChildName .ObjectMeta.Name `-kserve-workload-svc` }}'
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}
            name: v1-publisher-path-catch-all
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - kind: Service
              name: '{{ ChildName .ObjectMeta.Name `-kserve-workload-svc` }}'
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}
            name: v1-catch-all-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - kind: Service
              name: '{{ ChildName .ObjectMeta.Name `-kserve-workload-svc` }}'
              port: 8000
              weight: 1
            matches:
            - headers:
              - name: '{{ .GlobalConfig.ModelBasedRoutingHeaderName }}'
                type: Exact
                value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name
                  }}
            name: v1-catch-all-model-routing
            timeouts:
              backendRequest: 0s
              request: 0s
