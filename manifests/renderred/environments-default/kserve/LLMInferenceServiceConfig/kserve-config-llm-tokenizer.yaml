apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  labels:
    app.kubernetes.io/managed-by: Helmraiser
    app.tanka.grafana.com: kserve
  name: kserve-config-llm-tokenizer
  namespace: kserve
spec:
  router:
    scheduler:
      tokenizer:
        template:
          automountServiceAccountToken: false
          containers:
          - args: []
            command:
            - /bin/bash
            - -c
            - |-
              exec vllm launch render /mnt/models/base \
                --port=8000 \
                {{ if .GlobalConfig.EnableTLS }}--enable-ssl-refresh \
                --ssl-certfile /var/run/kserve/tls/tls.crt \
                --ssl-keyfile /var/run/kserve/tls/tls.key{{ end }}
            env:
            - name: HF_HOME
              value: /tmp/hf
            - name: DO_NOT_TRACK
              value: "1"
            image: docker.io/vllm/vllm-openai-cpu:v0.23.0@sha256:89e1fbe829038b1a560601990c8ec89625c622a969fcbc8f10ce48b6139795be
            imagePullPolicy: IfNotPresent
            name: main
            ports:
            - containerPort: 8000
              name: render-http
              protocol: TCP
            readinessProbe:
              failureThreshold: 60
              httpGet:
                path: /health
                port: render-http
                scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{- end
                  }}'
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
            resources:
              limits:
                cpu: "4"
                memory: 12Gi
              requests:
                cpu: "1"
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: false
              seccompProfile:
                type: RuntimeDefault
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: FallbackToLogsOnError
            volumeMounts:
            - mountPath: /tmp
              name: tmp-dir
            - mountPath: /var/run/kserve/tls
              name: tls-certs
              readOnly: true
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          volumes:
          - emptyDir: {}
            name: tmp-dir
          - name: tls-certs
            secret:
              secretName: '{{ ChildName .ObjectMeta.Name `-kserve-self-signed-certs`
                }}'
