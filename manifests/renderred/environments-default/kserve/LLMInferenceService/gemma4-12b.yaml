apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  labels:
    app.tanka.grafana.com: kserve
  name: gemma4-12b
  namespace: kserve
spec:
  model:
    name: google/gemma-4-12B-it-qat-w4a16-ct
    uri: hf://google/gemma-4-12B-it-qat-w4a16-ct
  replicas: 1
  template:
    containers:
    - args:
      - --chat-template
      - /vllm-workspace/examples/tool_chat_template_gemma4.jinja
      - --max-model-len
      - "262144"
      - --kv-cache-dtype
      - fp8
      - --reasoning-parser
      - gemma4
      - --tool-call-parser
      - gemma4
      - --enable-auto-tool-choice
      - --trust-remote-code
      - --max-num-seqs
      - "128"
      - --no-async-scheduling
      image: vllm/vllm-openai:gemma
      name: main
      resources:
        limits:
          cpu: "6"
          memory: 32Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
