apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/managed-by: Helmraiser
    app.tanka.grafana.com: holmesgpt
  name: healthchecks.holmesgpt.dev
  namespace: holmesgpt
spec:
  group: holmesgpt.dev
  names:
    kind: HealthCheck
    listKind: HealthCheckList
    plural: healthchecks
    shortNames:
    - hc
    singular: healthcheck
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Execution phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Check result
      jsonPath: .status.result
      name: Result
      type: string
    - description: Result message
      jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - description: Execution duration in seconds
      jsonPath: .status.duration
      name: Duration
      priority: 1
      type: number
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              destinations:
                description: Alert destinations for failed checks (only used in alert
                  mode)
                items:
                  properties:
                    config:
                      description: Destination-specific configuration
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type:
                      description: Destination type (e.g., 'slack', 'pagerduty')
                      type: string
                  required:
                  - type
                  type: object
                type: array
              mode:
                default: monitor
                description: 'Execution mode: ''alert'' sends notifications on failure,
                  ''monitor'' logs only'
                enum:
                - alert
                - monitor
                type: string
              model:
                description: Override default LLM model for this check
                type: string
              query:
                description: Natural language question about system health
                maxLength: 5000
                minLength: 1
                type: string
              timeout:
                default: 30
                description: Execution timeout in seconds
                maximum: 300
                minimum: 1
                type: integer
            required:
            - query
            type: object
          status:
            properties:
              completionTime:
                description: When the check execution completed
                format: date-time
                type: string
              conditions:
                description: Standard Kubernetes conditions
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned
                      format: date-time
                      type: string
                    message:
                      description: Human-readable message about the condition
                      type: string
                    reason:
                      description: Machine-readable reason for the condition
                      type: string
                    status:
                      description: 'Condition status: True, False, or Unknown'
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type (e.g., 'Complete', 'Failed')
                      type: string
                  required:
                  - type
                  - status
                  type: object
                type: array
              duration:
                description: Execution duration in seconds
                type: number
              error:
                description: Error details if execution failed
                type: string
              message:
                description: Human-readable summary of the result
                type: string
              modelUsed:
                description: The actual LLM model used for execution
                type: string
              notifications:
                description: Status of notification delivery attempts
                items:
                  properties:
                    channel:
                      description: Target channel or destination
                      type: string
                    error:
                      description: Error message if delivery failed
                      type: string
                    status:
                      description: 'Delivery status: sent, failed, skipped'
                      enum:
                      - sent
                      - failed
                      - skipped
                      type: string
                    type:
                      description: Notification type (e.g., 'slack', 'pagerduty')
                      type: string
                  type: object
                type: array
              phase:
                description: 'Execution phase: Pending, Running, Completed, Failed'
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                type: string
              rationale:
                description: Detailed explanation from the LLM about the decision
                type: string
              result:
                description: 'Check result: pass, fail, or error'
                enum:
                - pass
                - fail
                - error
                type: string
              startTime:
                description: When the check execution started
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
