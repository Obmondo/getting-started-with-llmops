apiVersion: v1
data:
  config.toml: |
    label-prefix = "k8saas.nvidia.com/"

    [circuitBreaker]
    percentage = 50
    duration = "5m"
    [[rule-sets]]
      enabled = true
      version = "1"
      name = "GPU fatal error ruleset"
      priority = 0

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.agent == 'gpu-health-monitor' && event.componentClass == 'GPU' && event.isFatal == true"

      [[rule-sets.match.all]]
        kind = "Node"
        expression = "!('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == \"false\") && !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == \"false\")"

      [rule-sets.cordon]
        shouldCordon = true
    [[rule-sets]]
      enabled = true
      version = "1"
      name = "CSP health monitor fatal error ruleset"
      priority = 0

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.agent == 'csp-health-monitor' && event.checkName == 'CSPMaintenance' && event.isFatal == true"

      [[rule-sets.match.all]]
        kind = "Node"
        expression = "!('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == \"false\") && !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == \"false\")"

      [rule-sets.cordon]
        shouldCordon = true
    [[rule-sets]]
      enabled = true
      version = "1"
      name = "Syslog fatal error ruleset"
      priority = 0

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.agent == 'syslog-health-monitor' && (event.componentClass == 'GPU' || event.componentClass == 'NIC') && event.isFatal == true"

      [[rule-sets.match.all]]
        kind = "Node"
        expression = "!('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == \"false\") && !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == \"false\")"

      [rule-sets.cordon]
        shouldCordon = true
    [[rule-sets]]
      enabled = true
      version = "1"
      name = "NIC health monitor fatal error ruleset"
      priority = 0

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.agent == 'nic-health-monitor' && event.isFatal == true"

      [[rule-sets.match.all]]
        kind = "Node"
        expression = "!('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == \"false\") && !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == \"false\")"

      [rule-sets.cordon]
        shouldCordon = true
    [[rule-sets]]
      enabled = true
      version = "1"
      name = "Kubernetes object monitor fatal error ruleset"
      priority = 0

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.agent == 'kubernetes-object-monitor' && event.isFatal == true"

      [[rule-sets.match.all]]
        kind = "Node"
        expression = "!('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == \"false\") && !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == \"false\")"

      [rule-sets.cordon]
        shouldCordon = true
    [[rule-sets]]
      enabled = true
      version = "1"
      name = "Preflight check fatal error ruleset"
      priority = 0

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.agent.startsWith('preflight-') && event.isFatal == true"

      [[rule-sets.match.all]]
        kind = "Node"
        expression = "!('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == \"false\") && !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == \"false\")"

      [rule-sets.cordon]
        shouldCordon = true
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/managed-by: Helmraiser
    app.kubernetes.io/name: fault-quarantine
    app.kubernetes.io/version: 1.16.0
    app.tanka.grafana.com: nvsentinel
    helm.sh/chart: fault-quarantine-0.1.0
  name: fault-quarantine
  namespace: nvsentinel
