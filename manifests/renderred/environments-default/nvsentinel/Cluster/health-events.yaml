apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  labels:
    app.tanka.grafana.com: nvsentinel
  name: health-events
  namespace: nvsentinel
spec:
  bootstrap:
    initdb:
      database: health-events
      owner: nvsentinel
      secret:
        name: health-events-database-owner-credentials
  instances: 1
  storage:
    size: 5Gi
