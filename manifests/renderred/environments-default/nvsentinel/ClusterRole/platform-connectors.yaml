apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/managed-by: Helmraiser
    app.kubernetes.io/name: nvsentinel
    app.kubernetes.io/version: v1.18.0
    app.tanka.grafana.com: nvsentinel
    helm.sh/chart: nvsentinel-v1.18.0
  name: platform-connectors
  namespace: nvsentinel
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - nodes/status
  verbs:
  - get
  - patch
  - update
  - list
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - update
  - list
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
