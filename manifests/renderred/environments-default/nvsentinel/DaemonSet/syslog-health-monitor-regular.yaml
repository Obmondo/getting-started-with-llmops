apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/managed-by: Helmraiser
    app.kubernetes.io/name: syslog-health-monitor
    app.kubernetes.io/version: 1.16.0
    app.tanka.grafana.com: nvsentinel
    helm.sh/chart: syslog-health-monitor-0.1.0
  name: syslog-health-monitor-regular
  namespace: nvsentinel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: nvsentinel
      app.kubernetes.io/name: syslog-health-monitor
      nvsentinel.dgxc.nvidia.com/kata: "false"
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: nvsentinel
        app.kubernetes.io/name: syslog-health-monitor
        nvsentinel.dgxc.nvidia.com/kata: "false"
    spec:
      containers:
      - args:
        - --polling-interval
        - 15s
        - --metrics-port
        - "2112"
        - --kata-enabled
        - "false"
        - --checks
        - SysLogsXIDError,SysLogsSXIDError,SysLogsGPUFallenOff
        - --metadata-path
        - /var/lib/nvsentinel/gpu_metadata.json
        - --processing-strategy
        - EXECUTE_REMEDIATION
        - --nic-driver-config
        - /etc/syslog-health-monitor/nic-driver.toml
        - --sysfs-root
        - /nvsentinel/sys
        - --boot-lookback-window
        - 2h
        - --cancellations-config
        - /etc/syslog-health-monitor/cancellations.toml
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: LOG_LEVEL
          value: info
        image: ghcr.io/nvidia/nvsentinel/syslog-health-monitor:v1.18.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 2112
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 3
        name: syslog-health-monitor
        ports:
        - containerPort: 2112
          name: metrics
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /metrics
            port: 2112
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          capabilities:
            add:
            - SYSLOG
            - SYS_ADMIN
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/run/
          name: var-run-vol
        - mountPath: /var/run/syslog_health_monitor
          name: syslog-state-vol
        - mountPath: /var/lib/nvsentinel
          name: metadata-vol
          readOnly: true
        - mountPath: /nvsentinel/var/log
          name: var-log-vol
          readOnly: true
        - mountPath: /nvsentinel/proc
          name: proc-vol
          readOnly: true
        - mountPath: /nvsentinel/sys
          name: sys-vol
          readOnly: true
        - mountPath: /etc/syslog-health-monitor
          name: syslog-health-monitor-config
          readOnly: true
      nodeSelector:
        nvsentinel.dgxc.nvidia.com/driver.installed: "true"
        nvsentinel.dgxc.nvidia.com/kata.enabled: "false"
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /var/run/nvsentinel
          type: DirectoryOrCreate
        name: var-run-vol
      - hostPath:
          path: /var/run/syslog_health_monitor
          type: DirectoryOrCreate
        name: syslog-state-vol
      - hostPath:
          path: /var/lib/nvsentinel
          type: DirectoryOrCreate
        name: metadata-vol
      - hostPath:
          path: /var/log
          type: Directory
        name: var-log-vol
      - hostPath:
          path: /sys
          type: Directory
        name: sys-vol
      - configMap:
          name: syslog-health-monitor-config
        name: syslog-health-monitor-config
      - hostPath:
          path: /proc
          type: Directory
        name: proc-vol
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 5%
    type: RollingUpdate
