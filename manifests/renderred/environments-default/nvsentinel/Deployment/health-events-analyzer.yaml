apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/managed-by: Helmraiser
    app.kubernetes.io/name: health-events-analyzer
    app.kubernetes.io/version: 1.16.0
    app.tanka.grafana.com: nvsentinel
    helm.sh/chart: health-events-analyzer-0.1.0
  name: health-events-analyzer
  namespace: nvsentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: nvsentinel
      app.kubernetes.io/name: health-events-analyzer
  template:
    metadata:
      annotations:
        checksum/config: 3cb3a59fd94a350a75e7c5d51dcd5fc1c620b4f337b158495474e9d79ff397ed
      labels:
        app.kubernetes.io/instance: nvsentinel
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: health-events-analyzer
        app.kubernetes.io/version: 1.16.0
        helm.sh/chart: health-events-analyzer-0.1.0
    spec:
      containers:
      - args:
        - --metrics-port=2112
        - --tls-enabled=false
        - --processing-strategy=EXECUTE_REMEDIATION
        - --workers=1
        - --max-in-flight=1000
        - --socket-token-path=/var/run/secrets/nvsentinel/platform-connector/token
        env:
        - name: LOG_LEVEL
          value: info
        - name: APP_NAME
          value: health-events-analyzer
        envFrom:
        - configMapRef:
            name: nvsentinel-datastore-config
            optional: true
        - secretRef:
            name: health-events-database-owner-credentials
            optional: false
        image: ghcr.io/nvidia/nvsentinel/health-events-analyzer:v1.33.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        name: health-events-analyzer
        ports:
        - containerPort: 2112
          name: metrics
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "1"
            memory: 1Gi
        securityContext:
          runAsGroup: 1001
          runAsUser: 1001
        volumeMounts:
        - mountPath: /etc/config/config.toml
          name: config-volume
          subPath: config.toml
        - mountPath: /var/run/secrets/nvsentinel/platform-connector
          name: platform-connector-token
          readOnly: true
        - mountPath: /var/run/
          name: var-run-vol
      restartPolicy: Always
      serviceAccountName: health-events-analyzer
      volumes:
      - configMap:
          items:
          - key: config.toml
            path: config.toml
          name: health-events-analyzer-config
        name: config-volume
      - name: platform-connector-token
        projected:
          sources:
          - serviceAccountToken:
              audience: platform-connector.nvsentinel.nvidia.com
              expirationSeconds: 3600
              path: token
      - hostPath:
          path: /var/run/nvsentinel
          type: DirectoryOrCreate
        name: var-run-vol
