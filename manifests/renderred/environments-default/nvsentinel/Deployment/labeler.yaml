apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/managed-by: Helmraiser
    app.kubernetes.io/name: labeler
    app.kubernetes.io/version: 1.16.0
    app.tanka.grafana.com: nvsentinel
    helm.sh/chart: labeler-0.1.0
  name: labeler
  namespace: nvsentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: nvsentinel
      app.kubernetes.io/name: labeler
  template:
    metadata:
      annotations:
        checksum/expected-device-counts-config: 5a28b4749361a06d8e8fac0a0023e91b4019fe9c0fa075953f5593cb3fdbc3de
      labels:
        app.kubernetes.io/instance: nvsentinel
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: labeler
        app.kubernetes.io/version: 1.16.0
        helm.sh/chart: labeler-0.1.0
    spec:
      containers:
      - args:
        - --metrics-port
        - "2112"
        - --require-dcgm-ready-for-bootstrap=true
        - --expected-device-counts-config-file
        - /etc/nvsentinel/labeler/expected-device-counts.toml
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: LOG_LEVEL
          value: info
        image: ghcr.io/nvidia/nvsentinel/labeler:v1.18.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        name: labeler
        ports:
        - containerPort: 2112
          name: metrics
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /etc/nvsentinel/labeler/expected-device-counts.toml
          name: expected-device-counts-config
          readOnly: true
          subPath: expected-device-counts.toml
      serviceAccountName: labeler
      volumes:
      - configMap:
          name: labeler
        name: expected-device-counts-config
